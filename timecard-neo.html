<script>
(function () {
'use strict';

var APP_VERSION = '1.0';
var APP_NAME = 'タイムカードNEO「把握できるちゃん」';
var FILE_NAME = 'タイムカードNEO（名前で打刻）.hta';
var FSO = null, IS_HTA = false;
try { FSO = new ActiveXObject('Scripting.FileSystemObject'); IS_HTA = true; } catch (e) {}

var WD = ['日', '月', '火', '水', '木', '金', '土'];

/* ========== 小道具 ========== */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad2(n) { n = +n; return (n < 10 ? '0' : '') + n; }
function now() { return window.TC_NOW_FN ? window.TC_NOW_FN() : new Date(); }
function ds(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDS(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function addDays(s, n) { var d = parseDS(s); return ds(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); }
function jDate(s) { var d = parseDS(s); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; }
function mdw(s) { var d = parseDS(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
function slash(s) { return s.substr(0, 4) + '/' + (+s.substr(5, 2)) + '/' + (+s.substr(8, 2)); }
function ymLabel(ym) { return ym.substr(0, 4) + '年' + (+ym.substr(5, 2)) + '月'; }
function ymOf(s) { return s.substr(0, 7); }
function ymAdd(ym, n) { var d = new Date(+ym.substr(0, 4), +ym.substr(5, 2) - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function monthLast(ym) { var d = new Date(+ym.substr(0, 4), +ym.substr(5, 2), 0); return ds(d); }
function stamp() { var d = now(); return ds(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function stampFile() { var d = now(); return ds(d).replace(/-/g, '') + '_' + pad2(d.getHours()) + pad2(d.getMinutes()); }
function toHalf(s) {
  return String(s == null ? '' : s).replace(/[\uFF01-\uFF5E]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  }).replace(/\u3000/g, ' ');
}
function normDate(s) {
  s = toHalf(s).replace(/\s/g, '');

      '中村 拓也', '小林 愛', '加藤 誠', '吉田 奈々', '佐々木 亮', '山田 陽子', '石川 直樹', '前田 理恵',
      '藤田 美咲', '岡本 浩二', '西村 由香', '森 勝'];
    var JOBS = ['校長', '教頭', '教諭', '教諭', '教諭', '教諭', '教諭', '教諭', '教諭', '教諭', '教諭', '教諭',
      '教諭', '教諭', '教諭', '教諭', '養護教諭', '事務職員', '講師', '学校用務員'];
    for (var i = 0; i < 20; i++) st.push({ sid: ('00' + (i + 1)).slice(-3), name: NAMES[i], job: JOBS[i], card: '', order: i + 1, active: true, ws: '', we: '', wsw: '' });
    st[16].ws = '8:15'; st[16].we = '13:10';   /* 藤田 美咲＝育児短時間勤務（13:10退勤） */
    st[11].wsw = '月7:45-16:15 金7:45-16:15';   /* 吉田 奈々＝月・金は時差出勤 */
    TC.saveStaff();
    var S = TC.S();
    S.schoolName = '○○市立△△小学校（お試し）';
    TC.saveSettings();
    /* 今日からさかのぼって75日分の記録（土日と祝日はとばす）＝先月1か月分がまるごと入る */
    function p2(n) { return (n < 10 ? '0' : '') + n; }
    function hsh(a, b) { var x = ((a + 7) * 73856093) ^ ((b + 13) * 19349663); x = x & 0x7fffffff; x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; }
    var LU = ['ok', 'some', 'no'], HO = ['no', 'yes', 'long'], months = {};
    var now0 = new Date(), d0 = new Date(now0.getFullYear(), now0.getMonth(), now0.getDate());
    for (var k = 75; k >= 1; k--) {
      var dt = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() - k);
      if (dt.getDay() === 0 || dt.getDay() === 6) continue;
      var ds = dt.getFullYear() + '-' + p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());
      if (TC.isOff(ds, '')) continue;
      for (i = 0; i < 20; i++) {
        if (hsh(i, k) < 0.06) continue;
        var inM = 445 + Math.floor(hsh(i, k) * 25);
        if (i === 13) inM = 485 + Math.floor(hsh(i, k) * 8);   /* 山田 陽子＝子どもを送ってから8:05ごろ出勤 */
        if (i === 11 && (dt.getDay() === 1 || dt.getDay() === 5)) inM -= 30;   /* 吉田 奈々＝月・金は30分早出 */
        var outM = inM + (i === 16 ? 290 + Math.floor(hsh(i + 3, k) * 50) : i === 13 ? 510 + Math.floor(hsh(i + 3, k) * 15) : 500 + Math.floor(hsh(i + 3, k) * 240));
        if (i === 13) outM = Math.max(outM, 1005 + Math.floor(hsh(i + 4, k) * 10));   /* 山田 陽子＝子育てで16:45すぎには帰る */
        var EXTRA = { 8: 230, 4: 150, 1: 130, 6: 100, 12: 95, 10: 90 };   /* 残業の多い人（赤・オレンジが見えるように） */
        if (EXTRA[i]) outM += EXTRA[i];
        if (i === 11 && (dt.getDay() === 1 || dt.getDay() === 5)) outM -= 30;
        var r = TC.getRec(ds, ('00' + (i + 1)).slice(-3), true);
        r.spans = [[inM, outM]]; r.inM = inM; r.outM = outM;
        var u = hsh(i + 5, k);
        r.lunch = LU[u < 0.25 ? 2 : u < 0.5 ? 1 : 0];
        r.brk = r.lunch === 'no' ? 0 : r.lunch === 'some' ? 20 : null;
        var v = hsh(i + 9, k);
        r.home = HO[v < 0.12 ? 2 : v < 0.4 ? 1 : 0];
        if (i === 13) { r.home = dt.getDay() === 1 ? 'h4' : hsh(i + 6, k) < 0.35 ? 'h3' : 'h2'; r.lunch = LU[u < 0.45 ? 2 : u < 0.8 ? 1 : 0]; r.brk = r.lunch === 'no' ? 0 : r.lunch === 'some' ? 20 : null; }   /* 山田 陽子＝毎日、家で2〜3時間（月曜は土日の分も合わせて4時間） */
        if (i === 4 && dt.getDay() === 1 && k <= 14 && k > 7) r.home = 'h10';   /* 井上 健太＝土日に5時間ずつ → 月曜に「10時間」 */
        var w1 = hsh(i + 11, k), w2 = hsh(i + 13, k);
        if (r.lunch === 'no') r.ltask = (w1 < 0.45 ? 'b' : w1 < 0.7 ? 'c' : w1 < 0.85 ? 'ab' : 'a') + (w2 < 0.2 ? 'c' : '');
        if (r.home && r.home !== 'no') r.htask = (w2 < 0.5 ? 'b' : w2 < 0.75 ? 'a' : w2 < 0.9 ? 'ab' : 'd');
      }
      months[ds.substr(0, 7)] = 1;
    }
    for (var ym in months) if (months.hasOwnProperty(ym)) TC.saveMonth(ym);
    TC.reloadAll();
    if (TC.gotoTab) TC.gotoTab('punch');
  } catch (e) {}
})();
</script>
